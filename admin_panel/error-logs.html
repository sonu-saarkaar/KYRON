<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Logs - KYRON Admin Panel</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">KYRON</div>
                <div class="sidebar-tagline">Admin Panel</div>
            </div>
            <nav>
                <ul class="sidebar-nav">
                    <li class="nav-item"><a href="dashboard.html" class="nav-link"><span class="nav-icon">📊</span> Dashboard</a></li>
                    <li class="nav-item"><a href="admins.html" class="nav-link"><span class="nav-icon">👥</span> Admin Management</a></li>
                    <li class="nav-item"><a href="users.html" class="nav-link"><span class="nav-icon">👤</span> User Management</a></li>
                    <li class="nav-item"><a href="agent-logs.html" class="nav-link"><span class="nav-icon">🤖</span> Agent Logs</a></li>
                    <li class="nav-item"><a href="login-logs.html" class="nav-link"><span class="nav-icon">🔐</span> Login Logs</a></li>
                    <li class="nav-item"><a href="error-logs.html" class="nav-link active"><span class="nav-icon">⚠️</span> Error Logs</a></li>
                    <li class="nav-item"><a href="settings.html" class="nav-link"><span class="nav-icon">⚙️</span> System Settings</a></li>
                    <li class="nav-item"><a href="#" class="nav-link" onclick="logout(); return false;"><span class="nav-icon">🚪</span> Logout</a></li>
                </ul>
            </nav>
        </aside>
        
        <main class="main-content">
            <div class="top-bar">
                <div class="top-bar-left">
                    <h2>Error Logs</h2>
                </div>
                <div class="top-bar-right">
                    <select id="daysFilter" onchange="loadLogs()" style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <option value="7">Last 7 days</option>
                        <option value="14">Last 14 days</option>
                        <option value="30">Last 30 days</option>
                    </select>
                </div>
            </div>
            
            <div class="card">
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Error Type</th>
                                <th>Message</th>
                                <th>Context</th>
                            </tr>
                        </thead>
                        <tbody id="logsTableBody">
                            <tr><td colspan="4" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/admin-auth.js"></script>
    <script src="js/error-logs.js"></script>
</body>
</html>
